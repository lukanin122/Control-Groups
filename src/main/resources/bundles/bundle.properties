cg.move = Drag to move the hotbar
cg.rotate = Rotate the hotbar
cg.reverse = Reverse group order
cg.units = Unit settings
cg.close = Close
cg.reset = Reset to defaults
cg.editor-schematic = HUD schematic
cg.editor-expanded = Expand settings
cg.projection = Show unit projections
cg.collapse = Collapse at the screen edge
cg.main-settings = Main settings
cg.space-allocation = Group space allocation
cg.space-limited = Limited expansion
cg.space-limited-help = Maximum group length is the available hotbar length divided by the total number of groups, after the settings area and gaps.
cg.space-equal = Equal adaptive expansion
cg.space-equal-help = Active groups can use empty groups' space. Their maximum length is the available hotbar length divided by the number of active groups.
cg.space-proportional = Proportional expansion
cg.space-proportional-help = Groups use only the space they need. When space is insufficient, it is distributed in proportion to the needs of their structural units.
cg.free-group-settings = Unassigned group
cg.unassigned = Unassigned group
cg.unassigned-help = Collect all free allied units without a saved group in a separate group.
cg.unassigned-first = Prioritize unassigned
cg.unassigned-first-help = Place the unassigned group first when enabled, or last when disabled.
cg.free-width = Unassigned group width
cg.free-follow = Follow main allocation
cg.free-follow-help = Use the selected group space allocation mode.
cg.free-limited = Limited width
cg.free-limited-help = Limit the unassigned group to a standard 1/11 share of the available hotbar length.
cg.free-residual = Remaining space
cg.free-residual-help = Use space remaining after the saved groups, protecting the configured minimum. The effective minimum cannot exceed one third of the hotbar length.
cg.free-minimum-help = Minimum unassigned group length. The entered value is preserved; layout caps the effective minimum at one third of the hotbar length.
cg.group-icon-settings = Group icon size
cg.icon-size = Icon size
cg.icon-size-help = Scale structural unit icons and counters, independently of projection images.
cg.icon-influence = Unit size influences icons
cg.icon-influence-help = Control how icon dimensions depend on the size of the unit.
cg.icon-coefficient = Influence (%)
cg.icon-coefficient-help = At 0%, all icons use the configured icon size. At 100%, icon sizes are proportional to natural unit sizes.
cg.tracking-settings = Tracking area
cg.tracking-square = Minimum tracking area height
cg.tracking-square-help = Extend external tracking areas toward the screen center to at least a square, when the screen allows. Disabled for internal projections. The extra space contributes to projection fitting.
cg.internal-projection = Internal projections
cg.internal-projection-help = Reserve projection space between groups instead of beside them.
cg.advanced = Full projections
cg.advanced-help = A more detailed tracking camera includes additional supported unit effects. May increase drawing cost.
cg.gap-settings = Spacing
cg.zero-gap = Settings button gap
cg.group-gap = Group gap
cg.tier-gap = Tier gap
cg.tier-gap-help = Spacing between tiers T1, T2, T3... inside each group.
cg.type-gap = Type gap
cg.type-gap-help = Spacing between unit types of the same tier.
cg.counter-gap = Counter and icon gap
cg.counter-gap-help = Space between the number and its unit icon.
cg.show-build = Show HUD in building mode
cg.full-icons = Full resolution icons
cg.full-icons-help = Replace uiIcon with a more detailed fullIcon when the displayed icon exceeds the original texture resolution.
cg.hide-singles = Hide N for a single unit
cg.hide-singles-help = Hide the counter when there is only one unit of this type.
cg.align = Align groups in a line
cg.align-help = Align all groups with the longest group.
cg.hover = Expand tabs on hover
cg.hover-help = Expand collapsed group panels when the mouse is over them.
cg.motion = Stuck indicator
cg.motion-help = For movement or patrol states, check unit.vel. Show Stuck when it is below the movement threshold.
cg.advanced-settings = Advanced settings
cg.damage-ticks = Damage indication (ticks)
cg.damage-ticks-help = How long to show damage received by a unit, in game ticks.
cg.projection-settings = Projection parameters
cg.adapt = Fit projections
cg.adapt-help = Automatically fits projections into the usable tracking areas, preserving unit proportions with compression.
cg.manual-largest = Set largest unit manually
cg.manual-largest-help = Replaces the automatically determined largest unit size with the entered value.
cg.manual-size-help = Increasing this value shrinks projections; decreasing it enlarges them.
cg.base = Control size
cg.base-help = The reference size used to calculate how compression affects unit sizes.
cg.compression = Compression (%)
cg.compression-help = Controls differences between projection sizes. At 0%, all units have the same size; at 100%, sizes are proportional to their original hitSize.
cg.occupancy = Projection occupancy (%)
cg.occupancy-help = The fraction of the tracking area's safe space occupied by the image.
cg.telemetry = Telemetry
cg.color = Color
cg.tier = Tier
cg.type = Type
cg.resize = Resize %
cg.ban = Ban
cg.ban-help = Exclude this unit type from Control-Groups counts, states, projections and size calculations. Unbanning does not bypass Mindustry command restrictions.
cg.stats = Observed: %d\nMembership: %.3f ms\nState: %.3f ms\nDraw: %.3f ms\nLayout rebuilds: %d
