cg.move = Перетащить хотбар
cg.rotate = Повернуть хотбар
cg.reverse = Изменить направление
cg.units = Настройки юнитов
cg.close = Закрыть
cg.reset = Сбросить по умолчанию
cg.editor-schematic = Схематика HUD
cg.editor-expanded = Раскрыть настройки
cg.projection = Отображение проекций
cg.collapse = Сокрытие у края экрана
cg.main-settings = Основные настройки
cg.space-allocation = Система выделения пространства групп
cg.space-limited = Ограниченное расширение
cg.space-limited-help = Максимальное расширение задаётся как ширина хотбара групп юнитов / общее число групп. Служебная область и отступы вычитаются заранее.
cg.space-equal = Равное адаптивное расширение
cg.space-equal-help = Позволяет активным группам расширяться на пространство других групп, пока то не используется ими. Максимальная ширина группы вычисляется как ширина хотбара групп юнитов / число активных групп.
cg.space-proportional = Пропорциональное расширение
cg.space-proportional-help = Если места достаточно, группы занимают только необходимое пространство. При нехватке места доступная ширина распределяется пропорционально потребностям структурных единиц.
cg.free-group-settings = Группа нераспределённых
cg.unassigned = Группа нераспределённых
cg.unassigned-help = Выделить в отдельную группу всех 'свободных' юнитов без группы.
cg.unassigned-first = Приоритетность нераспределённых
cg.unassigned-first-help = При включении группа нераспределённых находится в начале хотбара, при выключении — в конце.
cg.free-width = Ширина нераспределённой группы
cg.free-follow = Следование общему правилу
cg.free-follow-help = Использует настройку «Система выделения пространства групп».
cg.free-limited = Ограниченное расширение
cg.free-limited-help = Ширина нераспределённой группы ограничена стандартной долей одной из 11 групп.
cg.free-residual = Остаточное расширение
cg.free-residual-help = Нераспределённая группа использует пространство, оставшееся после остальных групп, но не меньше заданного минимума. Эффективный минимум ограничен третью длины хотбара.
cg.free-minimum-help = Минимальная ширина нераспределённой группы. Введённое значение сохраняется без обрезки; при расчёте применяется предел в треть длины хотбара.
cg.group-icon-settings = Размер иконок групп
cg.icon-size = Размер иконок
cg.icon-size-help = Задаёт исходный размер структурных единиц и счётчиков, не влияет на проекции в «областях отслеживания».
cg.icon-influence = Влияние размера юнита на иконку
cg.icon-influence-help = Регулировать зависимость размеров иконок от габаритов самих юнитов.
cg.icon-coefficient = Коэффициент влияния (%)
cg.icon-coefficient-help = Коэффициент влияния, где 0% — все иконки одинакового размера согласно настройке «Размер иконок». 100% — размеры иконок полностью пропорциональны натуральным размерам юнитов.
cg.tracking-settings = Область отслеживания
cg.tracking-square = Минимальная высота «области отслеживания»
cg.tracking-square-help = Внешняя область отслеживания расширяется к центру экрана как минимум до квадрата, если позволяет экран. Не действует при внутреннем размещении проекций. Дополнительное пространство учитывается при вписывании.
cg.internal-projection = Внутреннее размещение проекций
cg.internal-projection-help = Пространство для проекций выделяется между групп, а не сбоку.
cg.advanced = Полноценные проекции
cg.advanced-help = Более качественная камера отслеживает для проекции ещё и всякие спецэффекты, связанные с юнитом. Может увеличивать нагрузку на отрисовку.
cg.gap-settings = Отступы
cg.zero-gap = Отступ от переключателя настроек
cg.group-gap = Отступ между группами
cg.tier-gap = Отступ между тирами
cg.tier-gap-help = Отступ внутри групп по тирам Т1, Т2, Т3...
cg.type-gap = Отступ между типами
cg.type-gap-help = Отступ внутри групп у юнитов одного тира.
cg.counter-gap = Отступ счётчика и иконки
cg.counter-gap-help = Отступ между счётным числом и его иконкой.
cg.show-build = Отображать HUD в «режиме строительства»
cg.full-icons = Полноразмерные иконки
cg.full-icons-help = Если размер отображаемой иконки больше разрешения исходной текстуры, то uiIcon заменяется на fullIcon с целью сохранения качества отображения.
cg.hide-singles = Скрывать N при 1 юните
cg.hide-singles-help = Убирает число счёта при всего одном юните данного вида.
cg.align = Автовыравнивание групп в линию
cg.align-help = Выравнивание всех групп по самой длинной группе.
cg.hover = Раскрытие вкладок
cg.hover-help = В режиме «Сокрытие» панели групп выдвигаются при наведении на них курсора мышки.
cg.motion = Событие застревания
cg.motion-help = При событиях «Движение» или «Патруль» у юнита проверяется unit.vel. Если unit.vel меньше минимума — отображается событие «Застревание».
cg.advanced-settings = Продвинутые настройки
cg.damage-ticks = Индикация урона (тики)
cg.damage-ticks-help = Время в тиках, в течение которого будет отображаться событие получения урона для юнита.
cg.projection-settings = Параметры проекции
cg.adapt = Вписывание проекций
cg.adapt-help = Автоматически подгоняет размеры проекций под доступное пространство «областей отслеживания», сохраняя пропорции юнитов с учётом компрессии.
cg.manual-largest = Вручную задать наибольшего юнита
cg.manual-largest-help = Заменяет автоматически определяемый размер самого большого юнита указанным значением.
cg.manual-size-help = Увеличение значения уменьшает проекции, уменьшение — увеличивает.
cg.base = Контрольный размер
cg.base-help = Размер основания, относительно которого рассчитывается влияние компрессии на размеры юнитов.
cg.compression = Коэффициент компрессии (%)
cg.compression-help = Определяет различие размеров проекций. 0% — все юниты одинакового размера; 100% — размеры пропорциональны исходным hitSize.
cg.occupancy = Доля проекции (%)
cg.occupancy-help = Определяет, какую долю безопасного пространства области отслеживания занимает изображение.
cg.telemetry = Телеметрия
cg.color = Цвет
cg.tier = Тир
cg.type = Тип
cg.resize = Размер %
cg.ban = Бан
cg.ban-help = Исключить этот тип из групп, счётчиков, состояний, проекций и расчётов размеров Control-Groups. Снятие бана не отменяет ограничения командования Mindustry.
cg.stats = Наблюдается: %d\nСоставы: %.3f мс\nСостояния: %.3f мс\nРисование: %.3f мс\nПересчётов геометрии: %d
